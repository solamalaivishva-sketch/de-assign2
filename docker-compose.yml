
#  real-time taxi pipeline
#   3 Kafka brokers (KRaft) + topic init
#   producer + consumer (Python)  ->  Postgres
#   kafka-exporter + Prometheus + Grafana (observability)
#


x-kafka-common: &kafka-common
  image: apache/kafka:3.9.1
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
    interval: 15s
    timeout: 10s
    retries: 10
    start_period: 30s

x-kafka-env: &kafka-env
  CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"                # same id = same cluster
  KAFKA_PROCESS_ROLES: "broker,controller"           # each node is broker + controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:9093,2@kafka2:9093,3@kafka3:9093"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3                # every partition stored on 3 brokers
  KAFKA_MIN_INSYNC_REPLICAS: 2                       # acks=all needs 2 copies -> survives 1 broker down
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"           # topics are created explicitly (kafka-init)
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"

services:
  kafka1:
    <<: *kafka-common
    container_name: kafka1
    ports: ["9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka1:19092,EXTERNAL://localhost:9092"

  kafka2:
    <<: *kafka-common
    container_name: kafka2
    ports: ["9094:9094"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9094,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka2:19092,EXTERNAL://localhost:9094"

  kafka3:
    <<: *kafka-common
    container_name: kafka3
    ports: ["9095:9095"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9095,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka3:19092,EXTERNAL://localhost:9095"

  # One-off job: create the topic once all brokers are healthy, then exit
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: kafka-init
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka1:19092 --create --if-not-exists \
          --topic taxi-trips-stream --partitions 6 --replication-factor 3 \
          --config min.insync.replicas=2 \
          --config retention.ms=86400000 \
          --config compression.type=producer
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka1:19092 --describe --topic taxi-trips-stream

  postgres:
    image: postgres:16
    container_name: stream_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stream
      POSTGRES_PASSWORD: stream_pass
      POSTGRES_DB: streaming
    ports: ["5433:5432"]                               # 5432 is used by assignment 1
    volumes:
      - stream_pg:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stream -d streaming"]
      interval: 5s
      retries: 20

  producer:
    build: ./app
    container_name: producer
    command: ["python", "producer.py"]
    restart: on-failure
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    environment:
      KAFKA_BOOTSTRAP: "kafka1:19092,kafka2:19092,kafka3:19092"
      DATA_FILE: "/data/yellow_tripdata_2026-07.parquet"
      EVENTS_PER_SECOND: "30"
      LATE_PCT: "1"
    volumes:
      - ../assignment1/data/raw:/data:ro               # reuse the files downloaded in assignment 1

  consumer:
    build: ./app
    container_name: consumer
    command: ["python", "consumer.py"]
    restart: unless-stopped
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP: "kafka1:19092,kafka2:19092,kafka3:19092"
      PG_DSN: "host=postgres port=5432 dbname=streaming user=stream password=stream_pass"

  # Turns Kafka's internal state (brokers, offsets, consumer lag) into Prometheus metrics
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    restart: unless-stopped
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    command: ["--kafka.server=kafka1:19092", "--kafka.server=kafka2:19092", "--kafka.server=kafka3:19092"]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: unless-stopped
    ports: ["3001:3000"]                               # 3000 is used by Dagster
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  stream_pg: